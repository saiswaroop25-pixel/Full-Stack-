<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
        }

        table {
            background: white;
        }

        th {
            height: 50px;
            background: #ddd;
        }

        td {
            padding: 5px;
        }

        button {
            width: 60px;
            height: 50px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th colspan="4"></th>
        </tr>
        <tr>
            <td><button>DEL</button></td>
            <td><button>AC</button></td>
            <td><button>%</button></td>
            <td><button>÷</button></td>
        </tr>
        <tr>
            <td><button>7</button></td>
            <td><button>8</button></td>
            <td><button>9</button></td>
            <td><button>x</button></td>
        </tr>
        <tr>
            <td><button>4</button></td>
            <td><button>5</button></td>
            <td><button>6</button></td>
            <td><button>-</button></td>
        </tr>
        <tr>
            <td><button>1</button></td>
            <td><button>2</button></td>
            <td><button>3</button></td>
            <td><button>+</button></td>
        </tr>
        <tr>
            <td><button>00</button></td>
            <td><button>0</button></td>
            <td><button>.</button></td>
            <td><button>=</button></td>
        </tr>
    </table>
</body>
</html>
